AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lambda Python 3.14 triggered by SQS FIFO subscribed to existing SNS FIFO topic

Parameters:
  ExistingSnsFifoTopicArn:
    Type: String
    Description: ARN of existing SNS FIFO topic
    Default: arn:aws:sns:us-east-1:246814138873:pulse-values.fifo

  QueueName:
    Type: String
    Default: pulse-events.fifo
    Description: SQS FIFO queue name, must end with .fifo

Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64

Resources:
  PulseEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref QueueName
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 60

  PulseEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PulseEventsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSnsToSendMessages
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt PulseEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref ExistingSnsFifoTopicArn

  SnsToSqsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ExistingSnsFifoTopicArn
      Protocol: sqs
      Endpoint: !GetAtt PulseEventsQueue.Arn
      RawMessageDelivery: true

  PulseConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pulse-sqs-fifo-consumer
      CodeUri: pulse-values/
      Handler: app.lambda_handler
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt PulseEventsQueue.QueueName
      Events:
        PulseEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt PulseEventsQueue.Arn
            BatchSize: 1
            Enabled: true

Outputs:
  QueueUrl:
    Value: !Ref PulseEventsQueue

  QueueArn:
    Value: !GetAtt PulseEventsQueue.Arn

  LambdaName:
    Value: !Ref PulseConsumerFunction