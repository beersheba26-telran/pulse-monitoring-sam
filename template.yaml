AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Pulse monitoring pipeline with FIFO ingest and jumps analysis

Parameters:
  PulseEventsFifoTopicName:
    Type: String
    Default: pulse-events.fifo
    Description: Name of the existing SNS FIFO topic for incoming pulse probes. This stack never creates or deletes it.

  ExistingDbCredentialsSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:246814138873:secret:DB_PASSWORD-McVmoG
    Description: ARN of an existing AWS Secrets Manager secret containing the DB password.

  CommonLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:246814138873:layer:pulse-monitoring-common:4
    Description: ARN of the existing shared Lambda layer version to attach to the functions.
Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64

Resources:
  LastPulseValuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: last_pulse_values
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH

  PulseEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PulseEventsForJumpsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSnsToSendMessages
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource:
              - !GetAtt PulseEventsForJumpsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${PulseEventsFifoTopicName}

  PulseEventsForJumpsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pulse-events-for-jumps-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 60

  PulseEventsForJumpsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${PulseEventsFifoTopicName}
      Protocol: sqs
      Endpoint: !GetAtt PulseEventsForJumpsQueue.Arn
      RawMessageDelivery: true

  PulseJumpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: pulse-jumps

  JumpsAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jumps-analyzer
      CodeUri: jumps-analyzer/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayerArn
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt PulseEventsForJumpsQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref LastPulseValuesTable
        - Statement:
            - Sid: PublishJumps
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref PulseJumpsTopic
      Environment:
        Variables:
          LAST_PULSE_VALUES_TABLE_NAME: !Ref LastPulseValuesTable
          PULSE_JUMPS_TOPIC_ARN: !Ref PulseJumpsTopic
          JUMP_THRESHOLD_PERCENT: 40
          LOG_LEVEL: DEBUG
      Events:
        PulseEventsForJumps:
          Type: SQS
          Properties:
            Queue: !GetAtt PulseEventsForJumpsQueue.Arn
            BatchSize: 1
            Enabled: true

  JumpsPopulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jumps-populator
      CodeUri: jumps-populator/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLayerArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref ExistingDbCredentialsSecretArn
      Environment:
        Variables:
          DB_CREDENTIALS_SECRET_ARN: !Ref ExistingDbCredentialsSecretArn
          LOG_LEVEL: DEBUG
      Events:
        PulseJumpsTopicEvent:
          Type: SNS
          Properties:
            Topic: !Ref PulseJumpsTopic

Outputs:
  PulseEventsFifoTopicArn:
    Description: SNS FIFO topic ARN that receives incoming pulse probes
    Value: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${PulseEventsFifoTopicName}
