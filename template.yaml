AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Pulse monitoring pipeline with FIFO ingest, reduced-values processing, and jumps analysis

Parameters:
  PulseEventsFifoTopicName:
    Type: String
    Default: pulse-events.fifo
    Description: Name of the existing SNS FIFO topic for incoming pulse probes. This stack never creates or deletes it.

  ExistingDbCredentialsSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:246814138873:secret:DB_PASSWORD-McVmoG
    Description: ARN of an existing AWS Secrets Manager secret containing the DB password.

  
Globals:
  Function:
    Runtime: python3.14
    Timeout: 10
    MemorySize: 128
    Architectures:
      - x86_64

Resources:
  ReducingDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: reducing_data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH

  LastPulseValuesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: last_pulse_values
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device_id
          AttributeType: S
      KeySchema:
        - AttributeName: device_id
          KeyType: HASH

  PulseEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pulse-events-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 60

  PulseEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref PulseEventsQueue
        - !Ref PulseEventsForJumpsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSnsToSendMessages
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource:
              - !GetAtt PulseEventsQueue.Arn
              - !GetAtt PulseEventsForJumpsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${PulseEventsFifoTopicName}

  PulseEventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${PulseEventsFifoTopicName}
      Protocol: sqs
      Endpoint: !GetAtt PulseEventsQueue.Arn
      RawMessageDelivery: true

  PulseEventsForJumpsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pulse-events-for-jumps-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 60

  PulseEventsForJumpsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${PulseEventsFifoTopicName}
      Protocol: sqs
      Endpoint: !GetAtt PulseEventsForJumpsQueue.Arn
      RawMessageDelivery: true

  ReducedPulseValuesTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: reduced-pulse-values

  PulseJumpsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: pulse-jumps

  AbnormalPulseValuesTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: abnormal-pulse-values

  CommonLoggerLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: python3.14
    Properties:
      LayerName: common-logger
      Description: Contains logger_config.py and loguru dependency shared across Lambda functions
      ContentUri: layers/common-logger
      CompatibleRuntimes:
        - python3.14
      RetentionPolicy: Retain

  PulseValuesReducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pulse-values-reducer
      CodeUri: pulse_values_reducer/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLoggerLayer
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt PulseEventsQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref ReducingDataTable
        - Statement:
            - Sid: PublishReducedValues
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref ReducedPulseValuesTopic
      Environment:
        Variables:
          REDUCING_DATA_TABLE_NAME: !Ref ReducingDataTable
          REDUCED_PULSE_VALUES_TOPIC_ARN: !Ref ReducedPulseValuesTopic
          LOG_LEVEL: DEBUG
          REDUCING_PERIOD_SECONDS: 60
      Events:
        PulseEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt PulseEventsQueue.Arn
            BatchSize: 1
            Enabled: true

  JumpsAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jumps-analyzer
      CodeUri: jumps-analyzer/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLoggerLayer
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt PulseEventsForJumpsQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref LastPulseValuesTable
        - Statement:
            - Sid: PublishJumps
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref PulseJumpsTopic
      Environment:
        Variables:
          LAST_PULSE_VALUES_TABLE_NAME: !Ref LastPulseValuesTable
          PULSE_JUMPS_TOPIC_ARN: !Ref PulseJumpsTopic
          JUMP_THRESHOLD_PERCENT: 40
          LOG_LEVEL: DEBUG
      Events:
        PulseEventsForJumps:
          Type: SQS
          Properties:
            Queue: !GetAtt PulseEventsForJumpsQueue.Arn
            BatchSize: 1
            Enabled: true

  DeviceDataProviderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: device-data-provider
      CodeUri: device_data_provider/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLoggerLayer
      Policies:
        - Statement:
            - Sid: ReadDbCredentialsSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref ExistingDbCredentialsSecretArn
      Environment:
        Variables:
          DB_CREDENTIALS_SECRET_ARN: !Ref ExistingDbCredentialsSecretArn
          LOG_LEVEL: DEBUG

  AbnormalPulseAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: abnormal-pulse-analyzer
      CodeUri: abnormal-pulse-analyzer/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLoggerLayer
      Policies:
        - Statement:
            - Sid: InvokeDeviceDataProvider
              Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt DeviceDataProviderFunction.Arn
            - Sid: PublishAbnormalPulseValues
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref AbnormalPulseValuesTopic
      Environment:
        Variables:
          DATA_PROVIDER_FUNCTION_NAME: !Ref DeviceDataProviderFunction
          ABNORMAL_PULSE_TOPIC_ARN: !Ref AbnormalPulseValuesTopic
          LOG_LEVEL: DEBUG
      Events:
        ReducedValuesTopicEvent:
          Type: SNS
          Properties:
            Topic: !Ref ReducedPulseValuesTopic

  ReducedValuesPopulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: reduced-values-populator
      CodeUri: reduced_values_populator/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLoggerLayer
      Policies:
        - Statement:
            - Sid: ReadDbCredentialsSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref ExistingDbCredentialsSecretArn
      Environment:
        Variables:
          DB_CREDENTIALS_SECRET_ARN: !Ref ExistingDbCredentialsSecretArn
          LOG_LEVEL: DEBUG
      Events:
        ReducedValuesTopicEvent:
          Type: SNS
          Properties:
            Topic: !Ref ReducedPulseValuesTopic

  JumpsPopulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: jumps-populator
      CodeUri: jumps-populator/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLoggerLayer
      Policies:
        - Statement:
            - Sid: ReadDbCredentialsSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref ExistingDbCredentialsSecretArn
      Environment:
        Variables:
          DB_CREDENTIALS_SECRET_ARN: !Ref ExistingDbCredentialsSecretArn
          JUMP_MAJOR_THRESHOLD_PERCENT: 50
          JUMP_CRITICAL_THRESHOLD_PERCENT: 70
          LOG_LEVEL: DEBUG
      Events:
        PulseJumpsTopicEvent:
          Type: SNS
          Properties:
            Topic: !Ref PulseJumpsTopic

  NotificationsAbnormalValuesPopulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: notifications-abnormal-values-populator
      CodeUri: notifications-abnormal-values-populator/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLoggerLayer
      Policies:
        - Statement:
            - Sid: ReadDbCredentialsSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref ExistingDbCredentialsSecretArn
      Environment:
        Variables:
          DB_CREDENTIALS_SECRET_ARN: !Ref ExistingDbCredentialsSecretArn
          ABNORMAL_VALUES_MAJOR_THRESHOLD_PERCENT: 70
          ABNORMAL_VALUES_CRITICAL_THRESHOLD_PERCENT: 90
          LOG_LEVEL: DEBUG
      Events:
        AbnormalValuesTopicEvent:
          Type: SNS
          Properties:
            Topic: !Ref AbnormalPulseValuesTopic

  NotificationsJumpsPopulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: notifications-jumps-populator
      CodeUri: notifications-jumps-populator/
      Handler: app.lambda_handler
      Layers:
        - !Ref CommonLoggerLayer
      Policies:
        - Statement:
            - Sid: ReadDbCredentialsSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref ExistingDbCredentialsSecretArn
      Environment:
        Variables:
          DB_CREDENTIALS_SECRET_ARN: !Ref ExistingDbCredentialsSecretArn
          JUMP_MAJOR_THRESHOLD_PERCENT: 50
          JUMP_CRITICAL_THRESHOLD_PERCENT: 70
          LOG_LEVEL: DEBUG
      Events:
        PulseJumpsTopicEvent:
          Type: SNS
          Properties:
            Topic: !Ref PulseJumpsTopic

Outputs:
  ReducingDataTableName:
    Description: DynamoDB table used by pulse_values_reducer
    Value: !Ref ReducingDataTable

  PulseEventsFifoTopicArn:
    Description: SNS FIFO topic ARN that receives incoming pulse probes
    Value: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${PulseEventsFifoTopicName}

  PulseEventsQueueArn:
    Description: FIFO SQS queue subscribed to the pulse events FIFO topic
    Value: !GetAtt PulseEventsQueue.Arn

  PulseEventsForJumpsQueueArn:
    Description: FIFO SQS queue subscribed to pulse events for jumps analysis
    Value: !GetAtt PulseEventsForJumpsQueue.Arn

  ReducedPulseValuesTopicArn:
    Description: Standard SNS topic for reduced pulse probes
    Value: !Ref ReducedPulseValuesTopic

  PulseJumpsTopicArn:
    Description: SNS topic for pulse jumps events
    Value: !Ref PulseJumpsTopic

  AbnormalPulseValuesTopicArn:
    Description: SNS topic for abnormal pulse events
    Value: !Ref AbnormalPulseValuesTopic

  CommonLoggerLayerArn:
    Description: Shared Lambda layer ARN with common logger configuration
    Value: !Ref CommonLoggerLayer
